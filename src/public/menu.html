<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carta</title>
<style>
  :root { --bg:#fff; --fg:#1d1d1f; --mute:#6e6e73; --line:#e5e5ea; --acc:#0a7d4f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --fg:#f2f2f2; --mute:#9a9aa0; --line:#2a2a2e; --acc:#34c78a; } }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.4 system-ui,sans-serif; background:var(--bg); color:var(--fg); padding:0 16px 120px; max-width:560px; margin-inline:auto; }
  h1 { font-size:20px; margin:20px 0 4px; } h2 { font-size:16px; margin:24px 0 8px; color:var(--mute); text-transform:uppercase; letter-spacing:.04em; }
  .sub { color:var(--mute); margin:0 0 8px; }
  .item { display:flex; gap:12px; align-items:center; padding:12px 0; border-bottom:1px solid var(--line); }
  .item .info { flex:1; } .item .name { font-weight:600; } .item .desc { color:var(--mute); font-size:14px; }
  .item.off { opacity:.45; }
  button { font:inherit; border:1px solid var(--line); background:var(--bg); color:var(--fg); border-radius:8px; padding:8px 14px; }
  button.pri { background:var(--acc); border-color:var(--acc); color:#fff; font-weight:600; }
  .qty { display:flex; align-items:center; gap:8px; } .qty span { min-width:20px; text-align:center; }
  .bar { position:fixed; left:0; right:0; bottom:0; background:var(--bg); border-top:1px solid var(--line); padding:12px 16px; display:flex; gap:8px; max-width:560px; margin-inline:auto; }
  .bar button { flex:1; padding:12px; }
  #status { margin:12px 0; padding:10px 12px; border:1px solid var(--line); border-radius:8px; display:none; }
  #msg { color:var(--acc); min-height:1.4em; }
</style>
</head>
<body>
<h1 id="title">Carta</h1>
<p class="sub" id="sub"></p>
<div id="msg" role="status"></div>
<div id="status"></div>
<div id="menu"></div>
<div class="bar">
  <button id="bill">Pedir la cuenta</button>
  <button id="send" class="pri" disabled>Pedir</button>
</div>
<script>
const token = location.pathname.split('/')[2];
const money = (c) => (c / 100).toLocaleString('es-AR', { style: 'currency', currency: 'ARS' });
const cart = new Map();
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

async function api(method, path, body) {
  const r = await fetch('/api/public/' + path, { method, headers: { 'Content-Type': 'application/json' }, body: body && JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || 'Error');
  return j;
}
function renderCart() {
  const n = [...cart.values()].reduce((a, b) => a + b, 0);
  $('send').disabled = n === 0;
  $('send').textContent = n ? `Pedir (${n})` : 'Pedir';
}
async function load() {
  const data = await api('GET', 'menu/' + token);
  $('title').textContent = `Mesa ${data.table.number}`;
  $('sub').textContent = `Sector ${data.table.sector}`;
  const root = $('menu'); root.replaceChildren();
  for (const c of data.categories) {
    if (!c.products.length) continue;
    root.append(el('h2', null, c.name));
    for (const p of c.products) {
      const row = el('div', 'item' + (p.available ? '' : ' off'));
      const info = el('div', 'info');
      info.append(el('div', 'name', p.name));
      if (p.description) info.append(el('div', 'desc', p.description));
      info.append(el('div', null, p.available ? money(p.price_cents) : 'Agotado'));
      row.append(info);
      if (p.available) {
        const q = el('div', 'qty'); const count = el('span', null, String(cart.get(p.id) ?? 0));
        const set = (d) => { const v = Math.max(0, Math.min(20, (cart.get(p.id) ?? 0) + d)); v ? cart.set(p.id, v) : cart.delete(p.id); count.textContent = v; renderCart(); };
        const minus = el('button', null, '−'), plus = el('button', null, '+');
        minus.onclick = () => set(-1); plus.onclick = () => set(1);
        q.append(minus, count, plus); row.append(q);
      }
      root.append(row);
    }
  }
}
async function loadStatus() {
  const o = await api('GET', 'order/' + token);
  const box = $('status');
  if (!o.items.length) { box.style.display = 'none'; return; }
  const label = { por_confirmar: 'esperando al mozo', enviado: 'enviado a cocina', en_preparacion: 'en preparación', listo: 'listo', entregado: 'entregado', cancelado: 'cancelado' };
  box.replaceChildren(el('strong', null, 'Tu pedido — ' + money(o.totalCents)));
  for (const i of o.items) box.append(el('div', null, `${i.qty} × ${i.name} · ${label[i.status]}`));
  box.style.display = 'block';
}
$('send').onclick = async () => {
  try {
    const items = [...cart].map(([productId, qty]) => ({ productId, qty }));
    const r = await api('POST', 'order/' + token, { items });
    cart.clear(); renderCart(); await load(); await loadStatus();
    $('msg').textContent = r.needsConfirmation ? 'Pedido enviado. El mozo lo va a confirmar.' : '¡Pedido enviado a cocina!';
  } catch (e) { $('msg').textContent = e.message; }
};
$('bill').onclick = async () => {
  try { await api('POST', 'bill/' + token); $('msg').textContent = 'Avisamos al mozo, ya te trae la cuenta.'; }
  catch (e) { $('msg').textContent = e.message; }
};
load().then(loadStatus).catch((e) => { $('title').textContent = 'QR inválido'; $('msg').textContent = e.message; });
setInterval(() => loadStatus().catch(() => {}), 10000);
</script>
</body>
</html>
